<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="loom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
  </defs>
  <!-- Dark background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#1e1e2e" stroke="#313244" stroke-width="2"/>
