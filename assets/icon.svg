  <rect x="112" y="28" width="6" height="72" rx="3" fill="url(#loom-grad)"/>
  <!-- Staged cards -->
  <rect x="28" y="36" width="72" height="20" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <rect x="28" y="62" width="72" height="20" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <rect x="28" y="88" width="48" height="16" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <!-- Card accents -->
  <circle cx="38" cy="46" r="4" fill="#89b4fa"/>
  <circle cx="38" cy="72" r="4" fill="#a6e3a1"/>
  <circle cx="38" cy="96" r="4" fill="#f9e2af"/>
</svg>
